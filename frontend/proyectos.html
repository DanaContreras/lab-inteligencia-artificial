<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos · NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/proyectos.css">
</head>

<body>
  <script src="./js/menu.js"></script>

  <main id="content" class="contenido contenido-proyectos">
    <header class="proyectos-encabezado">
      <h2 class="proyectos-titulo">Proyectos</h2>

      <div class="proyectos-acciones">
        <button type="button" id="crear-proyecto" class="boton-proyecto boton-proyecto-principal">
          + Crear proyecto
        </button>

        <details class="desplegable">
          <summary class="boton-proyecto">Abrir</summary>
          <div class="desplegable-menu">
            <button type="button" id="abrir-equipo">Desde este equipo</button>
            <button type="button" id="abrir-drive">Desde Google Drive</button>
          </div>
        </details>

        <input type="file" id="archivo-proyecto" accept=".zip" hidden>
      </div>
    </header>

    <ul id="lista-proyectos" class="lista-proyectos"></ul>
    <p id="proyectos-mensaje" class="proyectos-mensaje" role="status"></p>
  </main>

  <template id="tpl-proyecto">
    <li class="proyecto-fila">
      <button type="button" class="proyecto-abrir" data-abrir>
        <svg class="icono-carpeta" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
        </svg>
        <span data-nombre></span>
      </button>

      <div class="proyecto-iconos">
        <button type="button" class="boton-icono" data-renombrar
                title="Renombrar" aria-label="Renombrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5Z" />
            <path d="m15 5 4 4" />
          </svg>
        </button>

        <details class="desplegable desplegable-icono">
          <summary class="boton-icono" title="Descargar" aria-label="Descargar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <path d="m7 10 5 5 5-5" />
              <path d="M12 15V3" />
            </svg>
          </summary>
          <div class="desplegable-menu">
            <button type="button" data-guardar-equipo>En este equipo</button>
            <button type="button" data-guardar-drive>En Google Drive</button>
          </div>
        </details>

        <button type="button" class="boton-icono boton-icono-peligro" data-eliminar
                title="Eliminar" aria-label="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
        </button>
      </div>
    </li>
  </template>

  <dialog id="modal-nombre" class="modal-nombre">
    <form id="form-nombre" method="dialog">
      <h2 id="modal-nombre-titulo"></h2>
      <input id="campo-nombre" type="text" maxlength="50" required
             aria-labelledby="modal-nombre-titulo">
      <div class="modal-nombre-acciones">
        <button type="button" id="cancelar-nombre" class="boton-proyecto">Cancelar</button>
        <button type="submit" class="boton-proyecto boton-proyecto-principal">Aceptar</button>
      </div>
    </form>
  </dialog>

  <script src="./js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://apis.google.com/js/api.js" async></script>
  <script src="./js/drive.js"></script>
  <script src="./js/proyectos.js"></script>
</body>
</html>
