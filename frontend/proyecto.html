<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar datos · NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/proyecto.css">
</head>

<body>

  <!-- Iconos de Lucide -->
  <svg hidden aria-hidden="true">
    <symbol id="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>

    <symbol id="lapiz" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
    </symbol>

    <symbol id="camara" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </symbol>

    <symbol id="goma" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m7 21 10 0" />
      <path d="m5.5 15.5 9-12a2 2 0 0 1 2.8-.4l3.2 2.4a2 2 0 0 1 .4 2.8l-9 12a2 2 0 0 1-2.8.4l-3.2-2.4a2 2 0 0 1-.4-2.8Z" />
      <path d="m9 11 6 4" />
    </symbol>

    <symbol id="cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>

  </svg>

  <button id="menu-toggle"
          type="button"
          class="boton-menu"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="sidebar">
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
  </button>

  <div id="overlay" class="fondo-oscuro"></div>

  <aside id="sidebar" class="panel" data-open="false">
    <h1 class="panel-marca">NeuroFAI</h1>

    <div class="nivel">
      <label class="interruptor">
        <input type="checkbox"
               id="nivel"
               class="interruptor-input"
               aria-label="Activar nivel avanzado">
        <span aria-hidden="true" class="interruptor-pista"></span>
        <span aria-hidden="true" class="interruptor-perilla"></span>
      </label>
      <p class="nivel-texto" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </div>

    <nav class="panel-nav">
      <a href="./proyecto.html" class="enlace-menu">Nuevo proyecto</a>
      <button type="button" class="enlace-menu">Tutorial</button>
    </nav>

    <button type="button" class="enlace-menu panel-pie">Acerca de nosotros</button>
  </aside>

  <main id="content" class="contenido contenido-proyecto">

    <header class="topbar">
      <h1 class="topbar-marca">NeuroFAI</h1>
      <p class="topbar-nivel" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </header>

    <nav aria-label="Progreso del proyecto">
      <ol class="pasos">

        <li class="paso paso-activo" aria-current="step">
          <span class="paso-numero">1</span>
          <span class="paso-etiqueta">Agregar datos</span>
        </li>

        <li aria-hidden="true" class="pasos-conector"></li>

        <li class="paso">
          <span class="paso-numero">2</span>
          <span class="paso-etiqueta">Entrenar</span>
        </li>

        <li aria-hidden="true" class="pasos-conector"></li>

        <li class="paso">
          <span class="paso-numero">3</span>
          <span class="paso-etiqueta">Predecir</span>
        </li>
      </ol>
    </nav>

    <section aria-label="Categorías del proyecto">
      <div id="lista-categorias" class="categorias"></div>

      <button id="agregar-categoria"
              type="button"
              class="boton-agregar"
              aria-label="Agregar categoría">
        <span aria-hidden="true">+</span>
      </button>
    </section>
  </main>

  <button id="siguiente-paso"
          type="button"
          class="boton-siguiente"
          disabled
          title="El paso 2 todavía no está implementado"
          aria-label="Ir al paso 2: entrenar">

    <svg aria-hidden="true" class="boton-siguiente-icono">
      <use href="#flecha" />
    </svg>
  </button>

  <dialog id="modal-muestra" class="modal" aria-labelledby="modal-titulo">
    <p id="modal-titulo" class="modal-titulo">¡Agrega un nuevo dato!</p>

    <div class="modal-panel">
      <button type="button" class="opcion" data-tipo="dibujo">
        <span class="opcion-icono" aria-hidden="true">
          <svg><use href="#lapiz" /></svg>
        </span>
        <span class="opcion-texto">Dibujo</span>
      </button>

      <button type="button" class="opcion" data-tipo="foto">
        <span class="opcion-icono" aria-hidden="true">
          <svg><use href="#camara" /></svg>
        </span>
        <span class="opcion-texto">Foto</span>
      </button>
    </div>
  </dialog>


<dialog id="modal-dibujo" class="modal" aria-labelledby="modal-titulo" >
  
  <div class="modal-panel">
    <header class="modal-encabezado">
      <h1 id="titulo-dibujo">Categoria</h1>

      <button type="button" class="cerrar-modal"
              onclick="document.getElementById('modal-dibujo').close()"
              aria-label="Cerrar">
          <span class="" aria-hidden="true">
              <svg class="icono"><use href="#cerrar"></use></svg>
          </span>
      </button>
    </header>


    <div class="editor-dibujo">

      <canvas id="lienzo"></canvas>

      <aside class="panel-herramientas">
        <div class="grupo-herramientas">
          <div class="contenedor-herramientas">
            <button type="button" class="opcion herramienta-activa"
                    data-herramienta="lapiz" aria-pressed="true">
              <span class="opcion-icono" aria-hidden="true">
                <svg class="icono"><use href="#lapiz"></use></svg>
              </span>
              <span class="opcion-texto">Lápiz</span>
            </button>

            <button type="button" class="opcion"
                    data-herramienta="goma" aria-pressed="false">
              <span class="opcion-icono" aria-hidden="true">
                <svg class="icono"><use href="#goma"></use></svg>
              </span>
              <span class="opcion-texto">Goma</span>
            </button>
          </div>
        </div>

        <div class="grupo-colores">
          <div class="contenedor-circulos">
            <button class="circulo circulo-negro active" onclick="changeColor('#000000')"></button>
            <button class="circulo circulo-rojo" onclick="changeColor('#FF0000')"></button>
            <button class="circulo circulo-azul" onclick="changeColor('#0B52D6')"></button>
            <button class="circulo circulo-verde" onclick="changeColor('#21c640')"></button>
            <button class="circulo circulo-amarillo" onclick="changeColor('#FFD133')"></button>
            <button class="circulo circulo-violeta" onclick="changeColor('#9d23de')"></button>
            <button class="circulo circulo-rosa" onclick="changeColor('#e773e0')"></button>
            <button class="circulo circulo-marron" onclick="changeColor('#89602e')"></button>
            <button class="circulo circulo-naranja" onclick="changeColor('#FD801A')"></button>
          </div>
        </div>
      </aside>                  
    </div>

    <div class="acciones-dibujo">
      <button type="button" id="limpiar-dibujo">Limpiar</button>
      <button type="button" id="cancelar-dibujo">Cancelar</button>
      <button type="button" id="guardar-dibujo" class="btn-guardar">
        Guardar dibujo
      </button>
    </div> 

  </div>
</dialog>

 
 
  <template id="tpl-categoria">
    <article class="categoria">

      <header class="categoria-encabezado">
        <input type="text"
               data-nombre
               class="categoria-nombre"
               maxlength="40"
               aria-label="Nombre de la categoría">

        <button type="button"
                data-eliminar
                class="categoria-eliminar"
                aria-label="Eliminar categoría">
    
          <span aria-hidden="true">&times;</span>
        </button>
      </header>

      <div class="categoria-cuerpo">
        <button type="button"
                data-agregar-muestra
                class="categoria-agregar"
                aria-label="Agregar dibujo a esta categoría">
          <span aria-hidden="true">+</span>
        </button>
      </div>
    </article>
  </template>

  <script src="./js/app.js"></script>
  <script src="./js/proyecto.js"></script>
  <script src="./js/canva.js"></script>
</body>
</html>
