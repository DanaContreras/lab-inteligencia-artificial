<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predecir · NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/proyecto.css">
  <link rel="stylesheet" href="./css/entrenar.css">
  <link rel="stylesheet" href="./css/predecir.css">
  <link rel="stylesheet" href="./css/avanzado.css">
</head>

<body>

  <!-- Iconos de Lucide -->
  <svg hidden aria-hidden="true">
    <symbol id="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>

    <symbol id="lapiz" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
    </symbol>

    <symbol id="camara" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
      <circle cx="12" cy="13" r="4" />
    </symbol>

    <symbol id="cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>

    <symbol id="goma" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m7 21 10 0" />
      <path d="m5.5 15.5 9-12a2 2 0 0 1 2.8-.4l3.2 2.4a2 2 0 0 1 .4 2.8l-9 12a2 2 0 0 1-2.8.4l-3.2-2.4a2 2 0 0 1-.4-2.8Z" />
      <path d="m9 11 6 4" />
    </symbol>

    <symbol id="subir_imagen" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" >
      <path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/>
      <path d="m14 19.5 3-3 3 3"/>
      <path d="M17 22v-5.5"/>
      <circle cx="9" cy="9" r="2"/>
    </symbol>
  </svg>

  <script src="./js/menu.js"></script>

  <main id="content" class="contenido contenido-proyecto">

    <header class="topbar">
      <h1 class="topbar-marca">NeuroFAI</h1>
      <p class="topbar-nivel" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </header>

    <nav aria-label="Progreso del proyecto">
      <ol class="pasos">

        <li class="paso paso-completo">
          <span class="paso-numero">1</span>
          <span class="paso-etiqueta">Agregar datos</span>
        </li>

        <li aria-hidden="true" class="pasos-conector pasos-conector-completo"></li>

        <li class="paso paso-completo">
          <span class="paso-numero">2</span>
          <span class="paso-etiqueta">Entrenar</span>
        </li>

        <li aria-hidden="true" class="pasos-conector pasos-conector-completo"></li>

        <li class="paso paso-activo" aria-current="step">
          <span class="paso-numero">3</span>
          <span class="paso-etiqueta">Predecir</span>
        </li>
      </ol>
    </nav>

    <p id="estado" class="estado" role="status">
      Dibuja algo y presiona Predecir
    </p>

    <section id="escenario" class="escenario escenario-prediccion" aria-label="Predicción">
      
      <!-- <div class="entrada">
        <div class="selector">
          <button type="button" class="boton-modo opcion" id="modo-dibujo" data-tipo="dibujo">
            <span class="opcion-icono" aria-hidden="true">
              <svg><use href="#lapiz" /></svg>
            </span>
            <span class="opcion-texto">Dibujo</span>
          </button>

          <button type="button" class="boton-modo opcion" id="modo-foto" data-tipo="foto">
            <span class="opcion-icono" aria-hidden="true">
              <svg><use href="#camara" /></svg>
            </span>
            <span class="opcion-texto">Foto</span>
          </button>
        </div> -->

        <div class="escenario-dibujo">
          <button type="button" id="entrada-prediccion" class="boton-accion">Ingresar entrada</button>
          <canvas id="pizarra" class="pizarra" width="320" height="320"
                  aria-label="Lienzo para dibujar"></canvas>

          <div class="acciones-prediccion">
            <button type="button" id="limpiar-pizarra" class="boton-accion">Limpiar</button>
            <button type="button" id="predecir" class="boton-accion boton-accion-primario">Predecir</button>
          </div>
          
        </div>
      </div>
      
      <svg id="red" class="red" viewBox="0 30 720 370" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg>

      <canvas id="particulas" class="particulas" aria-hidden="true"></canvas>
    </section>

    <div id="avanzado" class="avanzado avanzado-predecir" hidden>

      <section class="tarjeta predecir-dibujo" aria-labelledby="dibujo-titulo">
        <h2 id="dibujo-titulo" class="tarjeta-titulo">Dibujo</h2>

        <div id="lugar-pizarra" class="lugar-pizarra">
          <button type="button" id="limpiar-avanzado" class="boton-accion">Limpiar</button>
        </div>
      </section>

      <div class="avanzado-centro">
        <button type="button" id="predecir-avanzado" class="boton-accion boton-accion-primario">Predecir</button>
        <p id="estado-avanzado" class="estado-avanzado" role="status"></p>
      </div>

      <section class="tarjeta predecir-resultados" aria-labelledby="resultados-titulo">
        <h2 id="resultados-titulo" class="tarjeta-titulo">Resultados</h2>
        <ul id="resultados" class="resultados" aria-live="polite"></ul>
        <p id="coincidencia" class="tarjeta-texto"></p>
      </section>
    </div>

    <modales-comp></modales-comp>

    <p id="sin-datos" class="sin-datos" hidden>
      No hay datos para entrenar.
      <a href="./proyecto.html">Volver a agregar datos</a>
    </p>
  </main>

  <a href="./entrenar.html"
     class="boton-siguiente boton-anterior"
     aria-label="Volver al paso 2: entrenar"
     title="Entrenar">
    <svg aria-hidden="true" class="boton-siguiente-icono">
      <use href="#flecha" />
    </svg>
  </a>

  <script src="./js/app.js"></script>
  <script src="./js/red.js"></script>
  <script src="./js/metodos.js"></script>
  <script src="./js/modales.js"></script>
  <script src="./js/modal.js"></script>
  <script src="./js/canva.js"></script>
  <script src="./js/imagenes.js"></script>
  <script src="./js/predecir.js"></script>
  <script src="./js/predecir-avanzado.js"></script>
</body>
</html>
