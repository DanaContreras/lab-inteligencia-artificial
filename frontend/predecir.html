<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predecir · NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/proyecto.css">
  <link rel="stylesheet" href="./css/entrenar.css">
  <link rel="stylesheet" href="./css/predecir.css">
</head>

<body>

  <!-- Iconos de Lucide -->
  <svg hidden aria-hidden="true">
    <symbol id="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>
  </svg>

  <script src="./js/menu.js"></script>

  <main id="content" class="contenido contenido-proyecto">

    <header class="topbar">
      <h1 class="topbar-marca">NeuroFAI</h1>
      <p class="topbar-nivel" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </header>

    <nav aria-label="Progreso del proyecto">
      <ol class="pasos">

        <li class="paso paso-completo">
          <span class="paso-numero">1</span>
          <span class="paso-etiqueta">Agregar datos</span>
        </li>

        <li aria-hidden="true" class="pasos-conector pasos-conector-completo"></li>

        <li class="paso paso-completo">
          <span class="paso-numero">2</span>
          <span class="paso-etiqueta">Entrenar</span>
        </li>

        <li aria-hidden="true" class="pasos-conector pasos-conector-completo"></li>

        <li class="paso paso-activo" aria-current="step">
          <span class="paso-numero">3</span>
          <span class="paso-etiqueta">Predecir</span>
        </li>
      </ol>
    </nav>

    <p id="estado" class="estado" role="status">
      Dibuja algo y presiona Predecir
    </p>

    <section id="escenario" class="escenario escenario-prediccion" aria-label="Predicción">
      <div class="escenario-dibujo">
        <canvas id="pizarra" class="pizarra" width="320" height="320"
                aria-label="Lienzo para dibujar"></canvas>

        <div class="acciones-prediccion">
          <button type="button" id="limpiar-pizarra" class="boton-accion">Limpiar</button>
          <button type="button" id="predecir" class="boton-accion boton-accion-primario">Predecir</button>
        </div>
      </div>

      <svg id="red" class="red" viewBox="0 30 720 370" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg>

      <canvas id="particulas" class="particulas" aria-hidden="true"></canvas>
    </section>

    <p id="sin-datos" class="sin-datos" hidden>
      No hay datos para entrenar.
      <a href="./proyecto.html">Volver a agregar datos</a>
    </p>
  </main>

  <a href="./entrenar.html"
     class="boton-siguiente boton-anterior"
     aria-label="Volver al paso 2: entrenar"
     title="Entrenar">
    <svg aria-hidden="true" class="boton-siguiente-icono">
      <use href="#flecha" />
    </svg>
  </a>

  <script src="./js/app.js"></script>
  <script src="./js/red.js"></script>
  <script src="./js/predecir.js"></script>
</body>
</html>
