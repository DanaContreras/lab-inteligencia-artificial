<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>
  <button id="menu-toggle"
          type="button"
          class="boton-menu"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="sidebar">
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
  </button>

  <div id="overlay" class="fondo-oscuro"></div>

  <aside id="sidebar" class="panel" data-open="false">
    <h1 class="panel-marca">NeuroFAI</h1>

    <div class="nivel">
      <label class="interruptor">
        <input type="checkbox"
               id="nivel"
               class="interruptor-input"
               aria-label="Activar nivel avanzado">
        <span aria-hidden="true" class="interruptor-pista"></span>
        <span aria-hidden="true" class="interruptor-perilla"></span>
      </label>
      <p class="nivel-texto" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </div>

    <nav class="panel-nav">
      <a href="./proyecto.html" class="enlace-menu">Nuevo proyecto</a>
      <button type="button" class="enlace-menu">Tutorial</button>
    </nav>

    <button type="button" class="enlace-menu panel-pie">Acerca de nosotros</button>
  </aside>

  <main id="content" class="contenido">
    <h2 class="contenido-titulo">(Presentacion)</h2>
    <p class="contenido-texto">
      Presentacion de la pagina
    </p>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
