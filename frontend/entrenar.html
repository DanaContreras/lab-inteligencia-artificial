<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenar · NeuroFAI</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="stylesheet" href="./css/proyecto.css">
  <link rel="stylesheet" href="./css/entrenar.css">
</head>

<body>

  <!-- Iconos de Lucide -->
  <svg hidden aria-hidden="true">
    <symbol id="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6" />
    </symbol>
  </svg>

  <button id="menu-toggle"
          type="button"
          class="boton-menu"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="sidebar">
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
    <span aria-hidden="true" class="boton-menu-linea"></span>
  </button>

  <div id="overlay" class="fondo-oscuro"></div>

  <aside id="sidebar" class="panel" data-open="false">
    <h1 class="panel-marca">NeuroFAI</h1>

    <div class="nivel">
      <label class="interruptor">
        <input type="checkbox"
               id="nivel"
               class="interruptor-input"
               aria-label="Activar nivel avanzado">
        <span aria-hidden="true" class="interruptor-pista"></span>
        <span aria-hidden="true" class="interruptor-perilla"></span>
      </label>
      <p class="nivel-texto" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </div>

    <nav class="panel-nav">
      <a href="./proyecto.html" class="enlace-menu">Nuevo proyecto</a>
      <button type="button" class="enlace-menu">Tutorial</button>
    </nav>

    <button type="button" class="enlace-menu panel-pie">Acerca de nosotros</button>
  </aside>

  <main id="content" class="contenido contenido-proyecto">

    <header class="topbar">
      <h1 class="topbar-marca">NeuroFAI</h1>
      <p class="topbar-nivel" aria-live="polite">
        <span data-nivel-label>Nivel básico</span>
      </p>
    </header>

    <nav aria-label="Progreso del proyecto">
      <ol class="pasos">

        <li class="paso paso-completo">
          <span class="paso-numero">1</span>
          <span class="paso-etiqueta">Agregar datos</span>
        </li>

        <li aria-hidden="true" class="pasos-conector pasos-conector-completo"></li>

        <li class="paso paso-activo" aria-current="step">
          <span class="paso-numero">2</span>
          <span class="paso-etiqueta">Entrenar</span>
        </li>

        <li aria-hidden="true" class="pasos-conector"></li>

        <li class="paso">
          <span class="paso-numero">3</span>
          <span class="paso-etiqueta">Predecir</span>
        </li>
      </ol>
    </nav>

    <p id="estado" class="estado" role="status">
      Entrenando<span aria-hidden="true" class="estado-puntos"></span>
    </p>

    <section id="escenario" class="escenario" aria-label="Animación del entrenamiento">
      <figure class="escenario-dibujo">
        <img id="dibujo-actual" class="dibujo-actual desvanecido" alt="">
        <figcaption id="dibujo-categoria" class="dibujo-categoria"></figcaption>
      </figure>

      <svg id="red" class="red" viewBox="0 30 600 370" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg>

      <canvas id="particulas" class="particulas" aria-hidden="true"></canvas>
    </section>

    <p id="sin-datos" class="sin-datos" hidden>
      No hay datos para entrenar.
      <a href="./proyecto.html">Volver a agregar datos</a>
    </p>
  </main>

  <a href="./proyecto.html?continuar"
     class="boton-siguiente boton-anterior"
     aria-label="Volver al paso 1: agregar datos"
     title="Agregar datos">
    <svg aria-hidden="true" class="boton-siguiente-icono">
      <use href="#flecha" />
    </svg>
  </a>

  <button id="siguiente-paso"
          type="button"
          class="boton-siguiente"
          title="Predecir"
          aria-label="Ir al paso 3: predecir">
    <svg aria-hidden="true" class="boton-siguiente-icono">
      <use href="#flecha" />
    </svg>
  </button>

  <script src="./js/app.js"></script>
  <script src="./js/red.js"></script>
  <script src="./js/entrenar.js"></script>
</body>
</html>
